<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>SIGAE - Redirigiendo</title>
    <script type="text/javascript">
      // GitHub Pages SPA router redirect
      // Redirige rutas profundas como /web-dev-SIGAE/dashboard hacia index.html conservando la ruta
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p style="text-align:center; font-family: sans-serif; margin-top: 2rem;">Redirigiendo a SIGAE...</p>
  </body>
</html>
